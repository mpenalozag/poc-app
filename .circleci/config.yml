version: 2.1

orbs:
  bumper: mpenalozag/kustomize-bumper@dev:first

jobs:
  build_and_push_image:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Login to GHCR
          command: echo "$GHCR_TOKEN" | docker login ghcr.io -u mpenalozag --password-stdin
      - run:
          name: Setup QEMU + buildx
          command: |
            docker run --privileged --rm tonistiigi/binfmt --install all
            docker buildx create --use --name builder --bootstrap
      - run:
          name: Build and push arm64 image (kind cluster en Mac es arm64)
          command: |
            # Push both tags: stg uses :sha, prd uses :prod-sha (en producción Fintoc
            # son builds separados por branch, acá los pusheamos los dos en cada run para PoC).
            docker buildx build --platform linux/arm64 \
              -t ghcr.io/mpenalozag/poc-app:${CIRCLE_SHA1} \
              -t ghcr.io/mpenalozag/poc-app:prod-${CIRCLE_SHA1} \
              --push .

workflows:
  stg-deploy:
    when:
      equal: [main, << pipeline.git.branch >>]
    jobs:
      - build_and_push_image
      - bumper/bump:
          name: bump-stg
          requires: [build_and_push_image]
          env: stg
          manifests_path: stg
          image_registry: ghcr.io/mpenalozag/poc-app
          ssh_key_fingerprint: "SHA256:b3yRPGVHyN+ajw31VwwlbnmS1XWIVgZCunE4+LwyH7M"

  prd-deploy:
    when:
      equal: [production, << pipeline.git.branch >>]
    jobs:
      - build_and_push_image
      - bumper/bump:
          name: bump-prd
          requires: [build_and_push_image]
          env: prd
          manifests_path: prd
          image_registry: ghcr.io/mpenalozag/poc-app
          ssh_key_fingerprint: "SHA256:b3yRPGVHyN+ajw31VwwlbnmS1XWIVgZCunE4+LwyH7M"
      - bumper/bump:
          name: bump-prd-west-sim
          requires: [build_and_push_image]
          env: prd
          manifests_path: prd-west-sim
          image_registry: ghcr.io/mpenalozag/poc-app
          ssh_key_fingerprint: "SHA256:b3yRPGVHyN+ajw31VwwlbnmS1XWIVgZCunE4+LwyH7M"
